[project]
name = "mtchrs"
version = "0.2.0"
description = "Composable equality matchers for Python tests"
authors = [
    {name = "angru", email = "angru@list.ru"},
]
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["assertions", "matchers", "pytest", "testing"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]

[project.urls]
Repository = "https://github.com/angru/mtchrs"
Documentation = "https://angru.github.io/mtchrs/"
Issues = "https://github.com/angru/mtchrs/issues"

[build-system]
requires = ["setuptools>=80.9.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mtchrs"]

[tool.setuptools.package-data]
mtchrs = ["py.typed"]

[dependency-groups]
dev = [
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]
lint = [
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    "ruff>=0.11.13",
]
test = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "pygments>=2.19.1",
]
